<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - G&A Kids</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--gray-50); }
        .login-card { background: var(--white); padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .login-header { text-align: center; margin-bottom: 2rem; }
        .login-header .logo { width: 64px; height: 64px; border-radius: 12px; background: var(--primary); display: inline-flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1.5rem; margin-bottom: 1rem; }
        .login-header h1 { font-size: 1.5rem; font-weight: 700; }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-header">
            <div class="logo">G&A</div>
            <h1>G&A Kids</h1>
            <p>Sistema de Gestão Integrada</p>
        </div>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="admin@gakids.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2"><i class="fas fa-sign-in-alt"></i> Entrar</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert("Login simulado com sucesso! Redirecionando para o Dashboard...");
            window.location.href = '/index.html';
        });
    </script>
</body>
</html>
