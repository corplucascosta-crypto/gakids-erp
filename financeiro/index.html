<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro - G&A Kids</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .resumo-card { background: var(--white); padding: 20px; border-radius: 12px; border: 1px solid var(--gray-200); text-align: center; }
        .resumo-card .valor { font-size: 24px; font-weight: 700; margin-top: 5px; }
        .resumo-card .label { font-size: 14px; color: var(--gray-500); }
        .transacao-item { border-bottom: 1px solid var(--gray-100); padding: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .entrada { color: #10B981; }
        .saida { color: #EF4444; }
    </style>
</head>
<body>
    <div id="sidebar" class="sidebar">
        <div class="brand"><div class="logo">G&A</div><span class="name">G&A Kids</span></div>
        <nav class="nav">
            <a href="../index.html" class="nav-item"><i class="fas fa-chart-pie icon"></i><span>Dashboard</span></a>
            <a href="../estoque/" class="nav-item"><i class="fas fa-boxes icon"></i><span>Estoque</span></a>
            <a href="../vendas/" class="nav-item"><i class="fas fa-shopping-cart icon"></i><span>Vendas</span></a>
            <a href="../clientes/" class="nav-item"><i class="fas fa-users icon"></i><span>Clientes</span></a>
            <a href="../fornecedores/" class="nav-item"><i class="fas fa-truck icon"></i><span>Fornecedores</span></a>
            <a href="#" class="nav-item active"><i class="fas fa-coins icon"></i><span>Financeiro</span></a>
            <a href="../login/" class="nav-item sair"><i class="fas fa-sign-out-alt icon"></i><span>Sair</span></a>
        </nav>
    </div>
    <div class="main-content">
        <header class="header">
            <div class="left"><button class="toggle-sidebar" id="toggleSidebar"><i class="fas fa-bars"></i></button><h1 class="title">Gestão Financeira</h1></div>
            <div class="right"><button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button></div>
        </header>

        <div class="dashboard-grid" style="margin-bottom: 24px;">
            <div class="resumo-card"><div class="label">Saldo Atual</div><div class="valor" id="saldoAtual">R$ 0,00</div></div>
            <div class="resumo-card"><div class="label">Total Entradas</div><div class="valor entrada" id="totalEntradas">R$ 0,00</div></div>
            <div class="resumo-card"><div class="label">Total Saídas</div><div class="valor saida" id="totalSaidas">R$ 0,00</div></div>
        </div>

        <div class="card p-4 mb-4">
            <h5 class="mb-3">Nova Movimentação</h5>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Tipo</label>
                    <select class="form-select" id="tipoTransacao">
                        <option value="entrada">Entrada (Receita)</option>
                        <option value="saida">Saída (Despesa)</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Descrição</label>
                    <input type="text" class="form-control" id="descTransacao" placeholder="Ex: Venda do dia">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Valor (R$)</label>
                    <input type="number" class="form-control" id="valorTransacao" step="0.01">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-primary w-100" onclick="adicionarTransacao()"><i class="fas fa-plus"></i> Adicionar</button>
                </div>
            </div>
        </div>

        <div class="card p-4">
            <h5 class="mb-3">Histórico de Movimentações</h5>
            <div id="listaTransacoes">
                <p class="text-muted text-center">Nenhuma movimentação registrada.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simular um "banco de dados" local no navegador
        let transacoes = JSON.parse(localStorage.getItem('gakids_financeiro')) || [];

        function atualizarUI() {
            const saldo = transacoes.reduce((acc, t) => t.tipo === 'entrada' ? acc + t.valor : acc - t.valor, 0);
            const totalEntradas = transacoes.filter(t => t.tipo === 'entrada').reduce((acc, t) => acc + t.valor, 0);
            const totalSaidas = transacoes.filter(t => t.tipo === 'saida').reduce((acc, t) => acc + t.valor, 0);

            document.getElementById('saldoAtual').innerHTML = `R$ ${saldo.toFixed(2)}`;
            document.getElementById('totalEntradas').innerHTML = `R$ ${totalEntradas.toFixed(2)}`;
            document.getElementById('totalSaidas').innerHTML = `R$ ${totalSaidas.toFixed(2)}`;

            const container = document.getElementById('listaTransacoes');
            if(transacoes.length === 0) {
                container.innerHTML = '<p class="text-muted text-center">Nenhuma movimentação registrada.</p>';
            } else {
                container.innerHTML = '';
                // Mostrar as últimas 10 transações
                transacoes.slice().reverse().forEach(t => {
                    const div = document.createElement('div');
                    div.className = 'transacao-item';
                    div.innerHTML = `
                        <div>
                            <strong>${t.descricao}</strong><br>
                            <small class="text-muted">${t.tipo === 'entrada' ? 'Entrada' : 'Saída'}</small>
                        </div>
                        <div class="${t.tipo === 'entrada' ? 'entrada' : 'saida'} fw-bold">
                            ${t.tipo === 'entrada' ? '+' : '-'} R$ ${t.valor.toFixed(2)}
                            <button class="btn btn-sm btn-outline-danger ms-2" onclick="excluirTransacao(${t.id})"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }
        }

        window.adicionarTransacao = function() {
            const tipo = document.getElementById('tipoTransacao').value;
            const descricao = document.getElementById('descTransacao').value;
            const valor = parseFloat(document.getElementById('valorTransacao').value);

            if(!descricao || isNaN(valor) || valor <= 0) {
                return alert("Preencha todos os campos com valores válidos.");
            }

            const novaTransacao = {
                id: Date.now(),
                tipo: tipo,
                descricao: descricao,
                valor: valor
            };

            transacoes.push(novaTransacao);
            localStorage.setItem('gakids_financeiro', JSON.stringify(transacoes));
            
            document.getElementById('descTransacao').value = '';
            document.getElementById('valorTransacao').value = '';
            atualizarUI();
        };

        window.excluirTransacao = function(id) {
            if(confirm("Excluir esta transação?")) {
                transacoes = transacoes.filter(t => t.id !== id);
                localStorage.setItem('gakids_financeiro', JSON.stringify(transacoes));
                atualizarUI();
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            atualizarUI();
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const themeToggle = document.getElementById('themeToggle');
            const updateIcon = () => { themeToggle.innerHTML = document.documentElement.getAttribute('data-theme') === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>'; };
            updateIcon();
            themeToggle.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
                localStorage.setItem('theme', current === 'dark' ? 'light' : 'dark');
                updateIcon();
            });
            const toggle = document.getElementById('toggleSidebar');
            const sidebar = document.getElementById('sidebar');
            toggle.addEventListener('click', () => { if (window.innerWidth <= 768) sidebar.classList.toggle('open'); });
        });
    </script>
</body>
</html>
