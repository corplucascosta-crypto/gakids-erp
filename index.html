<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G&A Kids - Gestão Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7C3AED; --primary-light: #EDE9FE; --gray-50: #F9FAFB; --gray-200: #E5E7EB;
            --gray-500: #6B7280; --gray-900: #111827; --white: #FFFFFF; --success: #10B981; --danger: #EF4444;
        }
        [data-theme="dark"] {
            --gray-50: #111827; --gray-200: #374151; --gray-500: #9CA3AF; --gray-900: #F9FAFB; --white: #1F2937;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--gray-50); color: var(--gray-900); transition: 0.3s; }
        .sidebar { position: fixed; left: 0; top: 0; width: 240px; height: 100vh; background: var(--white); border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; z-index: 1000; }
        .sidebar .brand { padding: 24px 20px; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; gap: 12px; }
        .sidebar .brand .logo { width: 38px; height: 38px; border-radius: 10px; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .sidebar .brand .name { font-weight: 600; font-size: 18px; }
        .sidebar .nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
        .sidebar .nav .nav-item { display: flex; align-items: center; gap: 14px; padding: 10px 14px; color: var(--gray-500); text-decoration: none; border-radius: 8px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .sidebar .nav .nav-item:hover { background: var(--gray-50); color: var(--gray-900); }
        .sidebar .nav .nav-item.active { background: var(--primary-light); color: var(--primary); }
        .main-content { margin-left: 240px; padding: 24px; min-height: 100vh; }
        .header { display: flex; align-items: center; justify-content: space-between; background: var(--white); padding: 16px 24px; border-radius: 12px; border: 1px solid var(--gray-200); margin-bottom: 24px; }
        .header .left { display: flex; align-items: center; gap: 16px; }
        .header .left h1 { font-size: 20px; font-weight: 600; margin: 0; }
        .theme-toggle { background: none; border: none; font-size: 20px; color: var(--gray-500); cursor: pointer; }
        .dashboard-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 24px; }
        .card { background: var(--white); padding: 20px; border-radius: 12px; border: 1px solid var(--gray-200); }
        .card .header { display: flex; justify-content: space-between; margin-bottom: 8px; border: none; padding: 0; }
        .card .header .label { font-size: 14px; color: var(--gray-500); }
        .card .value { font-size: 22px; font-weight: 700; }
        .table-card { grid-column: 1 / -1; background: var(--white); padding: 20px; border-radius: 12px; border: 1px solid var(--gray-200); }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 8px; transition: 0.2s; }
        .btn-primary:hover { background: #5B21B6; color: white; }
        .btn-success { background: var(--success); color: white; border: none; padding: 8px 16px; border-radius: 8px; transition: 0.2s; }
        .btn-success:hover { background: #059669; color: white; }
        .input-group-custom { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .input-group-custom input, .input-group-custom select { padding: 8px 12px; border: 1px solid var(--gray-200); border-radius: 8px; flex: 1; min-width: 120px; }
        .estado-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .badge-ok { background: #D1FAE5; color: #065F46; }
        .badge-baixo { background: #FEF3C7; color: #92400E; }
        .badge-zero { background: #FEE2E2; color: #991B1B; }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); width: 280px; } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; padding: 16px; } .dashboard-grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
    <div id="sidebar" class="sidebar">
        <div class="brand"><div class="logo">G&A</div><span class="name">G&A Kids</span></div>
        <nav class="nav">
            <span class="nav-item active" onclick="trocarAba('dashboard', this)"><i class="fas fa-chart-pie icon"></i><span>Dashboard</span></span>
            <span class="nav-item" onclick="trocarAba('estoque', this)"><i class="fas fa-boxes icon"></i><span>Estoque</span></span>
            <span class="nav-item" onclick="trocarAba('financeiro', this)"><i class="fas fa-coins icon"></i><span>Financeiro</span></span>
            <span class="nav-item" onclick="trocarAba('vendas', this)"><i class="fas fa-shopping-cart icon"></i><span>Vendas</span></span>
        </nav>
    </div>
    <div class="main-content">
        <header class="header">
            <div class="left"><h1 id="tituloPagina">Dashboard</h1></div>
            <div class="right"><button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button></div>
        </header>
        <div id="conteudoApp"></div>
    </div>

    <script type="module">
        import { db } from './services/supabase.js';
        
        // ================== BANCO DE DADOS LOCAL (FALLBACK) ==================
        let dados = JSON.parse(localStorage.getItem('gakids_data')) || {
            produtos: [],
            vendas: [],
            transacoes: []
        };

        function salvarLocal() {
            localStorage.setItem('gakids_data', JSON.stringify(dados));
        }

        // ================== SINCORNIZAR COM SUPABASE ==================
        async function carregarInicial() {
            try {
                const { data: p } = await db.produtos.listar(); if(p && p.length > 0) dados.produtos = p;
                const { data: t } = await db.transacoes.listar(); if(t && t.length > 0) dados.transacoes = t;
                salvarLocal();
                renderDashboard();
            } catch (error) {
                console.log("Modo Offline (Fallback): Usando dados do navegador.");
                renderDashboard();
            }
        }

        async function syncProduto(nome, preco, qtd) {
            try {
                const { data, error } = await db.produtos.criar(nome, preco, qtd);
                if(!error && data) { 
                    dados.produtos.push(data[0]); 
                    salvarLocal(); 
                }
            } catch (e) { /* Fallback silencioso */ }
        }

        async function syncVenda(total, itens) {
            try {
                const { error } = await db.vendas.criar(total, itens);
                if(!error) console.log("Venda salva na nuvem!");
            } catch (e) { /* Fallback silencioso */ }
        }

        async function syncTransacao(tipo, desc, valor) {
            try {
                const { data, error } = await db.transacoes.criar(tipo, desc, valor);
                if(!error && data) { 
                    dados.transacoes.push(data[0]); 
                    salvarLocal(); 
                }
            } catch (e) { /* Fallback silencioso */ }
        }

        // ================== FUNÇÕES DE FORMATAÇÃO ==================
        const moeda = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);
        const numero = (v) => new Intl.NumberFormat('pt-BR').format(v);

        // ================== SISTEMA DE ABAS ==================
        function trocarAba(aba, element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            const titulos = { dashboard: 'Dashboard', estoque: 'Gestão de Estoque', financeiro: 'Gestão Financeira', vendas: 'Nova Venda' };
            document.getElementById('tituloPagina').innerText = titulos[aba];
            if(aba === 'dashboard') renderDashboard();
            if(aba === 'estoque') renderEstoque();
            if(aba === 'financeiro') renderFinanceiro();
            if(aba === 'vendas') renderVendas();
        }
        window.trocarAba = trocarAba;

        // ================== 1. DASHBOARD ==================
        function renderDashboard() {
            const totalVendas = dados.vendas.reduce((acc, v) => acc + v.total, 0);
            const totalDespesas = dados.transacoes.filter(t => t.tipo === 'saida').reduce((acc, t) => acc + t.valor, 0);
            const lucro = totalVendas - totalDespesas;
            const estoqueTotal = dados.produtos.reduce((acc, p) => acc + p.qtd, 0);
            const semEstoque = dados.produtos.filter(p => p.qtd === 0).length;
            const qtdVendas = dados.vendas.length;
            const ticketMedio = qtdVendas > 0 ? (totalVendas / qtdVendas) : 0;
            let ranking = {};
            dados.vendas.forEach(v => { v.itens.forEach(item => { ranking[item.nome] = (ranking[item.nome] || 0) + item.qtd; }); });
            let topProduto = Object.keys(ranking).sort((a,b) => ranking[b] - ranking[a])[0] || 'Nenhum';

            document.getElementById('conteudoApp').innerHTML = `
                <div class="dashboard-grid">
                    <div class="card"><div class="header"><span class="label">Vendas (Mês)</span></div><div class="value" style="color:var(--success)">${moeda(totalVendas)}</div></div>
                    <div class="card"><div class="header"><span class="label">Despesas (Mês)</span></div><div class="value" style="color:var(--danger)">${moeda(totalDespesas)}</div></div>
                    <div class="card"><div class="header"><span class="label">Lucro Líquido</span></div><div class="value" style="color:var(--primary)">${moeda(lucro)}</div></div>
                    <div class="card"><div class="header"><span class="label">Ticket Médio</span></div><div class="value">${moeda(ticketMedio)}</div></div>
                    <div class="card"><div class="header"><span class="label">Itens em Estoque</span></div><div class="value">${numero(estoqueTotal)}</div></div>
                    <div class="card"><div class="header"><span class="label">Produtos Esgotados</span></div><div class="value" style="color:var(--danger)">${numero(semEstoque)}</div></div>
                    <div class="card"><div class="header"><span class="label">Total de Vendas</span></div><div class="value">${numero(qtdVendas)}</div></div>
                    <div class="card"><div class="header"><span class="label">Mais Vendido</span></div><div class="value" style="font-size: 18px;">${topProduto}</div></div>
                </div>
            `;
        }

        // ================== 2. ESTOQUE ==================
        function renderEstoque() {
            let html = `
                <div class="table-card">
                    <div class="input-group-custom">
                        <input type="text" id="eNome" placeholder="Nome do produto" style="flex:2">
                        <input type="number" id="ePreco" placeholder="Preço (R$)" step="0.01" style="flex:1">
                        <input type="number" id="eQtd" placeholder="Qtd" style="flex:1">
                        <button class="btn-primary" onclick="adicionarProduto()">+ Adicionar</button>
                    </div>
                    <table class="table table-hover"><thead><tr><th>#</th><th>Produto</th><th>Preço</th><th>Qtd</th><th>Status</th><th></th></tr></thead><tbody>
            `;
            dados.produtos.forEach(p => {
                let badge = p.qtd === 0 ? 'badge-zero' : p.qtd < 10 ? 'badge-baixo' : 'badge-ok';
                let status = p.qtd === 0 ? 'Esgotado' : p.qtd < 10 ? 'Baixo' : 'OK';
                html += `<tr><td>#${p.id}</td><td>${p.nome}</td><td>${moeda(p.preco)}</td><td>${p.qtd}</td><td><span class="estado-badge ${badge}">${status}</span></td><td><button class="btn btn-sm btn-outline-danger" onclick="excluirProduto(${p.id})"><i class="fas fa-trash"></i></button></td></tr>`;
            });
            html += `</tbody></table></div>`;
            document.getElementById('conteudoApp').innerHTML = html;
        }

        window.adicionarProduto = async function() {
            const n = document.getElementById('eNome').value, p = parseFloat(document.getElementById('ePreco').value), q = parseInt(document.getElementById('eQtd').value);
            if(!n || isNaN(p) || isNaN(q)) return alert("Preencha todos os campos");
            await syncProduto(n, p, q);
            renderEstoque();
        };
        window.excluirProduto = function(id) {
            if(!confirm("Excluir?")) return;
            dados.produtos = dados.produtos.filter(p => p.id !== id);
            salvarLocal();
            renderEstoque();
        };

        // ================== 3. FINANCEIRO ==================
        function renderFinanceiro() {
            const totalEntradas = dados.transacoes.filter(t => t.tipo === 'entrada').reduce((acc, t) => acc + t.valor, 0);
            const totalSaidas = dados.transacoes.filter(t => t.tipo === 'saida').reduce((acc, t) => acc + t.valor, 0);
            const saldo = totalEntradas - totalSaidas;

            let html = `
                <div class="dashboard-grid">
                    <div class="card"><div class="header"><span class="label">Saldo Atual</span></div><div class="value" style="color:${saldo >= 0 ? 'var(--success)' : 'var(--danger)'}">${moeda(saldo)}</div></div>
                    <div class="card"><div class="header"><span class="label">Entradas</span></div><div class="value" style="color:var(--success)">${moeda(totalEntradas)}</div></div>
                    <div class="card"><div class="header"><span class="label">Saídas</span></div><div class="value" style="color:var(--danger)">${moeda(totalSaidas)}</div></div>
                </div>
                <div class="table-card">
                    <div class="input-group-custom">
                        <select id="fTipo"><option value="entrada">Entrada</option><option value="saida">Saída</option></select>
                        <input type="text" id="fDesc" placeholder="Descrição" style="flex:2">
                        <input type="number" id="fValor" placeholder="R$" step="0.01" style="flex:1">
                        <button class="btn-primary" onclick="adicionarTransacao()">Lançar</button>
                    </div>
                    <table class="table table-hover"><thead><tr><th>Descrição</th><th>Tipo</th><th>Valor</th><th></th></tr></thead><tbody>
            `;
            dados.transacoes.slice().reverse().forEach(t => {
                html += `<tr><td>${t.desc}</td><td>${t.tipo === 'entrada' ? 'Entrada' : 'Saída'}</td><td style="color:${t.tipo === 'entrada' ? 'var(--success)' : 'var(--danger)'}">${moeda(t.valor)}</td><td><button class="btn btn-sm btn-outline-danger" onclick="excluirTransacao(${t.id})"><i class="fas fa-trash"></i></button></td></tr>`;
            });
            html += `</tbody></table></div>`;
            document.getElementById('conteudoApp').innerHTML = html;
        }

        window.adicionarTransacao = async function() {
            const tipo = document.getElementById('fTipo').value, desc = document.getElementById('fDesc').value, valor = parseFloat(document.getElementById('fValor').value);
            if(!desc || isNaN(valor)) return alert("Preencha todos os campos");
            await syncTransacao(tipo, desc, valor);
            renderFinanceiro();
        };
        window.excluirTransacao = function(id) {
            if(!confirm("Excluir?")) return;
            dados.transacoes = dados.transacoes.filter(t => t.id !== id);
            salvarLocal();
            renderFinanceiro();
        };

        // ================== 4. VENDAS ==================
        function renderVendas() {
            let html = `
                <div class="table-card">
                    <h5>1. Selecione os Produtos</h5>
                    <div class="input-group-custom">
                        <select id="vProduto" style="flex:2">
                            <option value="">-- Escolha --</option>
                            ${dados.produtos.filter(p => p.qtd > 0).map(p => `<option value="${p.id}">${p.nome} (${p.qtd} un)</option>`).join('')}
                        </select>
                        <input type="number" id="vQtd" placeholder="Qtd" value="1" min="1" style="flex:1">
                        <button class="btn-primary" onclick="adicionarAoCarrinho()"><i class="fas fa-cart-plus"></i> Adicionar</button>
                    </div>
                </div>
                <div class="table-card">
                    <h5>2. Itens do Carrinho</h5>
                    <div id="carrinhoItens" class="mb-3"></div>
                    <div style="font-size: 20px; font-weight: 700; text-align: right; margin-bottom: 10px;">Total: <span id="totalCarrinho">R$ 0,00</span></div>
                    <button class="btn btn-success w-100" onclick="finalizarVenda()"><i class="fas fa-check"></i> Finalizar Venda e Baixar Estoque</button>
                </div>
            `;
            document.getElementById('conteudoApp').innerHTML = html;
            window.carrinho = [];
            renderizarCarrinho();
        }

        window.adicionarAoCarrinho = function() {
            const id = parseInt(document.getElementById('vProduto').value), qtd = parseInt(document.getElementById('vQtd').value);
            if(!id || isNaN(qtd) || qtd < 1) return alert("Selecione um produto");
            const prod = dados.produtos.find(p => p.id === id);
            if(qtd > prod.qtd) return alert("Estoque insuficiente!");
            const existe = window.carrinho.find(i => i.id === id);
            if(existe) existe.qtd += qtd; else window.carrinho.push({ id: prod.id, nome: prod.nome, preco: prod.preco, qtd });
            renderizarCarrinho();
        };

        function renderizarCarrinho() {
            const container = document.getElementById('carrinhoItens');
            if(!window.carrinho.length) { container.innerHTML = '<p class="text-muted">Carrinho vazio</p>'; document.getElementById('totalCarrinho').innerText = 'R$ 0,00'; return; }
            let total = 0, html = '';
            window.carrinho.forEach((item, i) => {
                total += item.preco * item.qtd;
                html += `<div class="d-flex justify-content-between border-bottom py-2"><div>${item.nome} x ${item.qtd}</div><div>${moeda(item.preco * item.qtd)} <button class="btn btn-sm btn-outline-danger" onclick="removerCarrinho(${i})">x</button></div></div>`;
            });
            container.innerHTML = html;
            document.getElementById('totalCarrinho').innerText = moeda(total);
        }
        window.removerCarrinho = function(i) { window.carrinho.splice(i, 1); renderizarCarrinho(); };

        window.finalizarVenda = function() {
            if(!window.carrinho.length) return alert("Carrinho vazio!");
            const total = window.carrinho.reduce((acc, i) => acc + (i.preco * i.qtd), 0);
            window.carrinho.forEach(item => {
                const prod = dados.produtos.find(p => p.id === item.id);
                if(prod) prod.qtd -= item.qtd;
            });
            dados.vendas.push({ id: Date.now(), itens: window.carrinho, total });
            salvarLocal();
            syncVenda(total, window.carrinho);
            alert("Venda finalizada com sucesso!");
            renderVendas();
        };

        // ================== DARK MODE ==================
        const themeToggle = document.getElementById('themeToggle');
        const updateIcon = () => { themeToggle.innerHTML = document.documentElement.getAttribute('data-theme') === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>'; };
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
        updateIcon();
        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
            localStorage.setItem('theme', current === 'dark' ? 'light' : 'dark');
            updateIcon();
        });

        // ================== INICIALIZAR ==================
        carregarInicial();
    </script>
</body>
</html>
