<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G&A Kids - Gestão de Produção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7C3AED; --primary-light: #EDE9FE; --gray-50: #F9FAFB; --gray-200: #E5E7EB;
            --gray-500: #6B7280; --gray-900: #111827; --white: #FFFFFF; --success: #10B981; --danger: #EF4444;
        }
        [data-theme="dark"] {
            --gray-50: #111827; --gray-200: #374151; --gray-500: #9CA3AF; --gray-900: #F9FAFB; --white: #1F2937;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--gray-50); color: var(--gray-900); transition: 0.3s; }
        
        .sidebar { position: fixed; left: 0; top: 0; width: 240px; height: 100vh; background: var(--white); border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; z-index: 1000; }
        .sidebar .brand { padding: 24px 20px; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; gap: 12px; }
        .sidebar .brand .logo { width: 38px; height: 38px; border-radius: 10px; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .sidebar .brand .name { font-weight: 600; font-size: 18px; }
        .sidebar .nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
        .sidebar .nav .nav-item { display: flex; align-items: center; gap: 14px; padding: 10px 14px; color: var(--gray-500); text-decoration: none; border-radius: 8px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .sidebar .nav .nav-item:hover { background: var(--gray-50); color: var(--gray-900); }
        .sidebar .nav .nav-item.active { background: var(--primary-light); color: var(--primary); }
        .sidebar .nav .nav-item.sair { margin-top: auto; border-top: 1px solid var(--gray-200); padding-top: 16px; color: var(--danger); }
        
        .main-content { margin-left: 240px; padding: 24px; min-height: 100vh; }
        .header { display: flex; align-items: center; justify-content: space-between; background: var(--white); padding: 16px 24px; border-radius: 12px; border: 1px solid var(--gray-200); margin-bottom: 24px; }
        .header .left { display: flex; align-items: center; gap: 16px; }
        .header .left h1 { font-size: 20px; font-weight: 600; margin: 0; }
        .theme-toggle { background: none; border: none; font-size: 20px; color: var(--gray-500); cursor: pointer; }
        .dashboard-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 24px; }
        .card { background: var(--white); padding: 20px; border-radius: 12px; border: 1px solid var(--gray-200); }
        .card .header { display: flex; justify-content: space-between; margin-bottom: 8px; border: none; padding: 0; }
        .card .header .label { font-size: 14px; color: var(--gray-500); }
        .card .value { font-size: 22px; font-weight: 700; }
        .table-card { grid-column: 1 / -1; background: var(--white); padding: 20px; border-radius: 12px; border: 1px solid var(--gray-200); }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 8px; transition: 0.2s; }
        .btn-primary:hover { background: #5B21B6; color: white; }
        .btn-success { background: var(--success); color: white; border: none; padding: 8px 16px; border-radius: 8px; transition: 0.2s; }
        .btn-success:hover { background: #059669; color: white; }
        .btn-fechar { background: var(--danger); color: white; border: none; padding: 8px 16px; border-radius: 8px; transition: 0.2s; width: 100%; margin-top: 10px; }
        .btn-fechar:hover { background: #b91c1c; color: white; }
        .input-group-custom { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .input-group-custom input, .input-group-custom select, .input-group-custom textarea { padding: 8px 12px; border: 1px solid var(--gray-200); border-radius: 8px; flex: 1; min-width: 120px; }
        .estado-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .badge-ok { background: #D1FAE5; color: #065F46; }
        .badge-baixo { background: #FEF3C7; color: #92400E; }
        .badge-zero { background: #FEE2E2; color: #991B1B; }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); width: 280px; } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; padding: 16px; } .dashboard-grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
    <div id="sidebar" class="sidebar">
        <div class="brand"><div class="logo">G&A</div><span class="name">G&A Kids</span></div>
        <nav class="nav">
            <span class="nav-item active" onclick="trocarAba('dashboard', this)"><i class="fas fa-chart-pie icon"></i><span>Dashboard</span></span>
            <span class="nav-item" onclick="trocarAba('estoque', this)"><i class="fas fa-boxes icon"></i><span>Estoque</span></span>
            <span class="nav-item" onclick="trocarAba('vendas', this)"><i class="fas fa-shopping-cart icon"></i><span>Vendas</span></span>
            <span class="nav-item" onclick="trocarAba('financeiro', this)"><i class="fas fa-coins icon"></i><span>Despesas (Matéria-Prima)</span></span>
        </nav>
    </div>
    <div class="main-content">
        <header class="header">
            <div class="left"><h1 id="tituloPagina">Dashboard</h1></div>
            <div class="right"><button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button></div>
        </header>
        <div id="conteudoApp"></div>
    </div>

    <script>
        // ================== BANCO DE DADOS ==================
        let dados = JSON.parse(localStorage.getItem('gakids_data')) || {
            produtos: [], // Matéria-prima / Produtos
            vendas: [],   // Vendas realizadas
            despesas: [], // Despesas manuais (tecidos, etiquetas, etc)
            historicoMensal: [] // Histórico de fechamentos
        };

        function salvarDados() { localStorage.setItem('gakids_data', JSON.stringify(dados)); }

        const moeda = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);
        const numero = (v) => new Intl.NumberFormat('pt-BR').format(v);

        // ================== SISTEMA DE ABAS ==================
        function trocarAba(aba, element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            const titulos = { dashboard: 'Dashboard', estoque: 'Gestão de Estoque', vendas: 'Nova Venda', financeiro: 'Despesas (Matéria-Prima)' };
            document.getElementById('tituloPagina').innerText = titulos[aba];
            if(aba === 'dashboard') renderDashboard();
            if(aba === 'estoque') renderEstoque();
            if(aba === 'vendas') renderVendas();
            if(aba === 'financeiro') renderFinanceiro();
        }
        window.trocarAba = trocarAba;

        // ================== 1. DASHBOARD ==================
        function renderDashboard() {
            if(!dados.historicoMensal) dados.historicoMensal = [];

            const totalVendas = dados.vendas.reduce((acc, v) => acc + v.total, 0);
            const totalCusto = dados.vendas.reduce((acc, v) => acc + v.custoTotal, 0);
            const totalDespesas = dados.despesas.reduce((acc, d) => acc + d.valor, 0);
            const lucroBruto = totalVendas - totalCusto;
            const lucroLiquido = lucroBruto - totalDespesas;
            
            const estoqueTotal = dados.produtos.reduce((acc, p) => acc + p.qtd, 0);
            const semEstoque = dados.produtos.filter(p => p.qtd === 0).length;
            const qtdVendas = dados.vendas.length;
            const ticketMedio = qtdVendas > 0 ? (totalVendas / qtdVendas) : 0;

            let ranking = {};
            dados.vendas.forEach(v => { v.itens.forEach(item => { ranking[item.nome] = (ranking[item.nome] || 0) + item.qtd; }); });
            let topProduto = Object.keys(ranking).sort((a,b) => ranking[b] - ranking[a])[0] || 'Nenhum';

            document.getElementById('conteudoApp').innerHTML = `
                <div class="dashboard-grid">
                    <div class="card"><div class="header"><span class="label">💰 Vendas</span></div><div class="value" style="color:var(--success)">${moeda(totalVendas)}</div></div>
                    <div class="card"><div class="header"><span class="label">📦 Custo Total</span></div><div class="value" style="color:var(--primary)">${moeda(totalCusto)}</div></div>
                    <div class="card"><div class="header"><span class="label">📉 Despesas</span></div><div class="value" style="color:var(--danger)">${moeda(totalDespesas)}</div></div>
                    <div class="card"><div class="header"><span class="label">✅ Lucro Líquido</span></div><div class="value" style="color:${lucroLiquido >= 0 ? 'var(--success)' : 'var(--danger)'}">${moeda(lucroLiquido)}</div></div>
                    <div class="card"><div class="header"><span class="label">🎫 Ticket Médio</span></div><div class="value">${moeda(ticketMedio)}</div></div>
                    <div class="card"><div class="header"><span class="label">📦 Estoque</span></div><div class="value">${numero(estoqueTotal)} un</div></div>
                    <div class="card"><div class="header"><span class="label">⚠️ Esgotados</span></div><div class="value" style="color:var(--danger)">${numero(semEstoque)}</div></div>
                    <div class="card"><div class="header"><span class="label">🏆 Mais Vendido</span></div><div class="value" style="font-size: 18px;">${topProduto}</div></div>
                </div>
            `;
        }

        // ================== 2. ESTOQUE ==================
        function renderEstoque() {
            let html = `
                <div class="table-card">
                    <h5>Cadastrar Produto</h5>
                    <div class="input-group-custom">
                        <input type="text" id="eNome" placeholder="Nome do produto" style="flex:2">
                        <input type="number" id="eCusto" placeholder="Custo (R$)" step="0.01" style="flex:1">
                        <input type="number" id="eQtd" placeholder="Qtd" style="flex:1">
                        <button class="btn-primary" onclick="adicionarProduto()">+ Adicionar</button>
                    </div>
                    <table class="table table-hover mt-3"><thead><tr><th>#</th><th>Produto</th><th>Custo</th><th>Qtd</th><th>Status</th><th></th></tr></thead><tbody>
            `;
            dados.produtos.forEach(p => {
                let badge = p.qtd === 0 ? 'badge-zero' : p.qtd < 10 ? 'badge-baixo' : 'badge-ok';
                let status = p.qtd === 0 ? 'Esgotado' : p.qtd < 10 ? 'Baixo' : 'OK';
                html += `<tr><td>#${p.id}</td><td>${p.nome}</td><td>${moeda(p.custo)}</td><td>${p.qtd}</td><td><span class="estado-badge ${badge}">${status}</span></td><td><button class="btn btn-sm btn-outline-danger" onclick="excluirProduto(${p.id})"><i class="fas fa-trash"></i></button></td></tr>`;
            });
            html += `</tbody></table></div>`;
            document.getElementById('conteudoApp').innerHTML = html;
        }

        window.adicionarProduto = function() {
            const n = document.getElementById('eNome').value, c = parseFloat(document.getElementById('eCusto').value), q = parseInt(document.getElementById('eQtd').value);
            if(!n || isNaN(c) || isNaN(q)) return alert("Preencha todos os campos");
            dados.produtos.push({ id: Date.now(), nome: n, custo: c, qtd: q });
            salvarDados(); renderEstoque();
        };
        window.excluirProduto = function(id) {
            if(!confirm("Excluir?")) return;
            dados.produtos = dados.produtos.filter(p => p.id !== id);
            salvarDados(); renderEstoque();
        };

        // ================== 3. VENDAS ==================
        function renderVendas() {
            let html = `
                <div class="table-card">
                    <h5>1. Selecione os Produtos</h5>
                    <div class="input-group-custom">
                        <select id="vProduto" style="flex:2">
                            <option value="">-- Escolha --</option>
                            ${dados.produtos.filter(p => p.qtd > 0).map(p => `<option value="${p.id}">${p.nome} (Custo: ${moeda(p.custo)})</option>`).join('')}
                        </select>
                        <input type="number" id="vQtd" placeholder="Qtd" value="1" min="1" style="flex:1">
                        <input type="number" id="vPrecoVenda" placeholder="Preço Venda (R$)" step="0.01" style="flex:1">
                        <button class="btn-primary" onclick="adicionarAoCarrinho()"><i class="fas fa-cart-plus"></i> Adicionar</button>
                    </div>
                </div>
                <div class="table-card">
                    <h5>2. Itens do Carrinho</h5>
                    <div id="carrinhoItens" class="mb-3"></div>
                    <div style="font-size: 20px; font-weight: 700; text-align: right; margin-bottom: 10px;">
                        Total Venda: <span id="totalCarrinho">R$ 0,00</span><br>
                        <small class="text-muted">Custo Total: <span id="custoTotalCarrinho">R$ 0,00</span></small>
                    </div>
                    <button class="btn btn-success w-100" onclick="finalizarVenda()"><i class="fas fa-check"></i> Finalizar Venda</button>
                </div>
            `;
            document.getElementById('conteudoApp').innerHTML = html;
            window.carrinho = [];
            renderizarCarrinho();
        }

        window.adicionarAoCarrinho = function() {
            const id = parseInt(document.getElementById('vProduto').value), qtd = parseInt(document.getElementById('vQtd').value), precoVenda = parseFloat(document.getElementById('vPrecoVenda').value);
            if(!id || isNaN(qtd) || isNaN(precoVenda)) return alert("Selecione um produto e defina o preço de venda.");
            const prod = dados.produtos.find(p => p.id === id);
            if(qtd > prod.qtd) return alert("Estoque insuficiente!");
            const existe = window.carrinho.find(i => i.id === id);
            if(existe) existe.qtd += qtd; else window.carrinho.push({ id: prod.id, nome: prod.nome, custo: prod.custo, qtd, precoVenda });
            renderizarCarrinho();
        };

        function renderizarCarrinho() {
            const container = document.getElementById('carrinhoItens');
            if(!window.carrinho.length) { container.innerHTML = '<p class="text-muted">Carrinho vazio</p>'; document.getElementById('totalCarrinho').innerText = 'R$ 0,00'; document.getElementById('custoTotalCarrinho').innerText = 'R$ 0,00'; return; }
            let total = 0, totalCusto = 0, html = '';
            window.carrinho.forEach((item, i) => {
                total += item.precoVenda * item.qtd;
                totalCusto += item.custo * item.qtd;
                html += `<div class="d-flex justify-content-between border-bottom py-2"><div>${item.nome} x ${item.qtd} (Custo: ${moeda(item.custo)} / Venda: ${moeda(item.precoVenda)})</div><div>${moeda(item.precoVenda * item.qtd)} <button class="btn btn-sm btn-outline-danger" onclick="removerCarrinho(${i})">x</button></div></div>`;
            });
            container.innerHTML = html;
            document.getElementById('totalCarrinho').innerText = moeda(total);
            document.getElementById('custoTotalCarrinho').innerText = moeda(totalCusto);
        }
        window.removerCarrinho = function(i) { window.carrinho.splice(i, 1); renderizarCarrinho(); };

        window.finalizarVenda = function() {
            if(!window.carrinho.length) return alert("Carrinho vazio!");
            const total = window.carrinho.reduce((acc, i) => acc + (i.precoVenda * i.qtd), 0);
            const custoTotal = window.carrinho.reduce((acc, i) => acc + (i.custo * i.qtd), 0);
            
            window.carrinho.forEach(item => {
                const prod = dados.produtos.find(p => p.id === item.id);
                if(prod) prod.qtd -= item.qtd;
            });
            
            dados.vendas.push({ id: Date.now(), itens: window.carrinho, total, custoTotal });
            salvarDados();
            alert(`Venda finalizada!\nTotal: ${moeda(total)}\nCusto: ${moeda(custoTotal)}\nLucro: ${moeda(total - custoTotal)}`);
            renderVendas();
        };

        // ================== 4. DESPESAS (MATÉRIA-PRIMA) ==================
        function renderFinanceiro() {
            let html = `
                <div class="table-card">
                    <h5>Lançar Despesa com Matéria-Prima (Tecidos, Etiquetas, etc.)</h5>
                    <div class="input-group-custom">
                        <input type="text" id="fDesc" placeholder="Descrição (Ex: Compra de Tecido)" style="flex:2">
                        <input type="number" id="fValor" placeholder="Valor (R$)" step="0.01" style="flex:1">
                        <button class="btn-primary" onclick="adicionarDespesa()">Lançar Despesa</button>
                    </div>
                    <table class="table table-hover mt-3"><thead><tr><th>Descrição</th><th>Valor</th><th></th></tr></thead><tbody>
            `;
            if(!dados.despesas) dados.despesas = [];

            dados.despesas.slice().reverse().forEach(d => {
                html += `<tr><td>${d.desc}</td><td style="color:var(--danger)">${moeda(d.valor)}</td><td><button class="btn btn-sm btn-outline-danger" onclick="excluirDespesa(${d.id})"><i class="fas fa-trash"></i></button></td></tr>`;
            });
            html += `</tbody></table></div>`;
            document.getElementById('conteudoApp').innerHTML = html;
        }

        window.adicionarDespesa = function() {
            const desc = document.getElementById('fDesc').value, valor = parseFloat(document.getElementById('fValor').value);
            if(!desc || isNaN(valor)) return alert("Preencha todos os campos");
            dados.despesas.push({ id: Date.now(), desc, valor });
            salvarDados(); renderFinanceiro();
        };
        window.excluirDespesa = function(id) {
            if(!confirm("Excluir despesa?")) return;
            dados.despesas = dados.despesas.filter(d => d.id !== id);
            salvarDados(); renderFinanceiro();
        };

        // ================== 5. FECHAMENTO MENSAL ==================
        function executarFechamentoMensal() {
            const hoje = new Date();
            if(hoje.getDate() === 1) {
                if(!dados.vendas) dados.vendas = [];
                if(!dados.despesas) dados.despesas = [];

                const totalVendas = dados.vendas.reduce((acc, v) => acc + v.total, 0);
                const totalCusto = dados.vendas.reduce((acc, v) => acc + v.custoTotal, 0);
                const totalDespesas = dados.despesas.reduce((acc, d) => acc + d.valor, 0);
                const lucroFinal = (totalVendas - totalCusto) - totalDespesas;

                if(totalVendas > 0 || totalDespesas > 0) {
                    if(!dados.historicoMensal) dados.historicoMensal = [];
                    
                    dados.historicoMensal.push({
                        mes: `${hoje.getMonth() + 1}/${hoje.getFullYear()}`,
                        vendas: totalVendas,
                        custos: totalCusto,
                        despesas: totalDespesas,
                        lucro: lucroFinal
                    });
                    dados.vendas = [];
                    dados.despesas = [];
                    salvarDados();
                    console.log("Fechamento mensal realizado!");
                }
            }
        }

        // ================== DARK MODE ==================
        const themeToggle = document.getElementById('themeToggle');
        const updateIcon = () => { themeToggle.innerHTML = document.documentElement.getAttribute('data-theme') === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>'; };
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
        updateIcon();
        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
            localStorage.setItem('theme', current === 'dark' ? 'light' : 'dark');
            updateIcon();
        });

        // ================== INICIALIZAR ==================
        if(!dados.vendas) dados.vendas = [];
        if(!dados.despesas) dados.despesas = [];
        if(!dados.historicoMensal) dados.historicoMensal = [];
        salvarDados();

        executarFechamentoMensal();
        renderDashboard();
    </script>
</body>
</html>
